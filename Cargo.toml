[package]
name = "jevernetes"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Bounded, read-only Kubernetes log analysis with typed Jev judgments"
license = "Apache-2.0"
repository = "https://github.com/sunil-sadasivan/jevernetes"
include = ["src/**", "tests/rust/**", "Cargo.toml", "Cargo.lock", "README.md", "docs/architecture.md", "docs/migration.md", "docs/usage.md", "SECURITY.md", "LICENSE", "NOTICE"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_34"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
lru = "0.18"
regex = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "io-std", "fs", "net", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
unicode-width = "0.2"

[[test]]
name = "cli"
path = "tests/rust/cli.rs"
