[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevernetes-legacy"
version = "0.1.0"
description = "Legacy Jevernetes dashboard, TUI, search, review and context companion"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["kubernetes", "kubectl", "logs", "observability", "jev"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/sunil-sadasivan/jevernetes"
Issues = "https://github.com/sunil-sadasivan/jevernetes/issues"

[project.scripts]
jevernetes-legacy = "jevernetes.cli:main"

[tool.setuptools.packages.find]
include = ["jevernetes*"]

[tool.setuptools.package-data]
jevernetes = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
