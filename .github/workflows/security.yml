name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    name: TruffleHog secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: '3.97.5'
          extra_args: --no-verification --fail-on-scan-errors
  python-security:
    name: Bandit and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install isolated security tooling
        run: |
          python -m venv .security-venv
          .security-venv/bin/python -m pip install -r requirements-dev.txt
      - name: Fail on medium or high severity Python findings
        run: .security-venv/bin/python -m bandit -r jev_log_analyzer --severity-level medium --confidence-level medium
      - name: Audit development and build dependencies
        run: .security-venv/bin/python -m pip_audit --strict -r requirements-dev.txt
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          category: /language:${{ matrix.language }}
