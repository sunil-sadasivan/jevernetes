name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.94.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - name: Native TUI search and terminal cleanup
        run: python3 tests/rust/tui_pty.py target/release/jevernetes
      - name: Offline synthetic CLI smoke
        run: |
          printf 'ERROR synthetic failure\nINFO ready\n' | target/release/jevernetes files - --offline --json > /tmp/jevernetes-smoke.json
          python3 -c 'import json; r=json.load(open("/tmp/jevernetes-smoke.json")); assert r["summary"]["events"] == 2; assert r["summary"]["important"] == 1; assert r["summary"]["uncertain"] == 1'
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check jevernetes/web/app.js
      - run: node --check jevernetes/web/search.js
      - run: node tests/test_context_ui.cjs
      - run: node tests/test_prompt_ui.cjs
      - run: node tests/test_review_ui.cjs
      - run: node tests/test_grouping_ui.cjs
      - run: node tests/test_search_ui.cjs
      - run: python tools/check_release.py
      - if: matrix.python == '3.13'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m build
          python tools/check_release.py --dist dist
